[project]
name = "unienv_input_devices"
version = "0.0.1a1"
requires-python = ">= 3.10"
dependencies = [
    "unienv",
    "numpy",
    "avp_stream",
]

[project.optional-dependencies]
test = ["pytest"]
wilor = [
    "torch",
    "opencv-python",
    "scipy",
    # Not on PyPI; this fork carries torch>=2.6 / Python>=3.11 compat fixes
    # (relaxed pins, ultralytics>=8.4, explicit weights_only=False).
    # NOTE: chumpy must be installed manually first — see README.
    "wilor_mini @ git+https://github.com/realquantumcookie/WiLoR-mini",
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/unienv-input-devices"
Documentation = "https://github.com/UniEnvOrg/unienv-input-devices"
Repository = "https://github.com/UniEnvOrg/unienv-input-devices"
Issues = "https://github.com/UniEnvOrg/unienv-input-devices/issues"
Changelog = "https://github.com/UniEnvOrg/unienv-input-devices/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*"]