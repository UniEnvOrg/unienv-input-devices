[project]
name = "unienv_input_devices"
version = "0.0.1a1"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.10"
dependencies = [
    "unienv>=0.0.1b16",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest", "scipy"]  # scipy: the AVP / WiLoR keypoint math tests
avp = ["avp_stream"]
spacemouse = ["pyspacemouse>=2.1"]
# PyPI rejects direct (git) dependencies, so `chumpy` (git master) and the
# `wilor_mini` fork are installed separately; see docs/wilor.md.
wilor = [
    "torch",
    "opencv-python",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/unienv-input-devices"
Documentation = "https://github.com/UniEnvOrg/unienv-input-devices"
Repository = "https://github.com/UniEnvOrg/unienv-input-devices"
Issues = "https://github.com/UniEnvOrg/unienv-input-devices/issues"
Changelog = "https://github.com/UniEnvOrg/unienv-input-devices/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["training*", "tests*"]
